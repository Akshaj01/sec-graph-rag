version: '3.8'

services:
  neo4j:
    image: neo4j:5.23.0
    container_name: neo4j_graphrag
    ports:
      - "7474:7474" # HTTP port for Neo4j Browser
      - "7687:7687" # Bolt port for Python Driver
    environment:
      - NEO4J_AUTH=neo4j/password # Default credentials (change in production)
      # APOC Configuration
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # Automatically download and install APOC plugin on startup
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data # Persist database data
      - neo4j_plugins:/plugins
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector_graphrag
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: secgraph
      POSTGRES_PASSWORD: password
      POSTGRES_DB: secgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secgraph -d secgraph"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_plugins:
  postgres_data:
